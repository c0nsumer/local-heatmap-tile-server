<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Heatmap Tile Server</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.21.0/dist/maplibre-gl.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e14;
    --surface: #12161e;
    --surface2: #1a1f2b;
    --border: #2a3040;
    --text: #c8cdd8;
    --text-dim: #6b7280;
    --accent: #ffa040;
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #map { flex: 1; background: var(--bg); }

  /* Control panel */
  .panel {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    min-width: 220px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .panel h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .stats-bar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    display: flex;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat-value {
    font-weight: 600;
    color: var(--accent);
    font-size: 14px;
  }
  .stat-label {
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .status-link {
    color: var(--text-dim);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
    transition: color 0.15s;
  }
  .status-link:hover { color: var(--accent); }

  .panel select {
    width: 100%;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: 'DM Sans', system-ui, sans-serif;
    cursor: pointer;
  }
  .panel select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .overlay-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .overlay-toggle input[type="checkbox"] {
    appearance: none;
    width: 14px; height: 14px;
    border: 2px solid #00ff88;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  .overlay-toggle input[type="checkbox"]:checked {
    background: #00ff88;
  }
  .overlay-toggle input[type="checkbox"]:checked::after {
    content: '\2713'; position: absolute; top: -3px; left: 1px;
    font-size: 11px; color: var(--bg); font-weight: bold;
  }

  .gpx-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .gpx-drop {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 12px 8px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .gpx-drop:hover, .gpx-drop.dragover {
    border-color: var(--accent);
    color: var(--text);
  }
  .gpx-drop input { display: none; }
  .gpx-file-list { margin-top: 8px; font-size: 11px; }
  .gpx-file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    color: var(--text);
  }
  .gpx-file-item .gpx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .gpx-remove {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 0 4px;
    transition: color 0.15s;
  }
  .gpx-remove:hover { color: #e04060; }

  /* Override MapLibre controls for dark theme */
  .maplibregl-ctrl-group {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
  }
  .maplibregl-ctrl-group button {
    background-color: var(--surface) !important;
    color: var(--text) !important;
  }
  .maplibregl-ctrl-group button + button {
    border-top: 1px solid var(--border) !important;
  }
  .maplibregl-ctrl-group button span {
    filter: invert(0.8);
  }
  .maplibregl-ctrl-attrib {
    background: rgba(10,14,20,0.8) !important;
    color: var(--text-dim) !important;
    font-size: 10px !important;
  }
  .maplibregl-ctrl-attrib a { color: var(--text-dim) !important; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel" id="panel">
  <h2>Heatmap Style</h2>
  <select id="style-select">
    <option value="warm">Warm (Orange/Red)</option>
    <option value="cool">Cool (Blue)</option>
  </select>
  <label class="overlay-toggle">
    <input type="checkbox" id="top10-toggle">
    <span>Highlight Top 10%</span>
  </label>
  <h2 style="margin-top:12px">Base Map</h2>
  <select id="basemap-select">
    <option value="carto-dark">CartoDB Dark</option>
    <option value="osm">OpenStreetMap</option>
    <option value="carto-light">CartoDB Positron</option>
  </select>
  <div class="gpx-section">
    <h2>GPX Overlay</h2>
    <div class="gpx-drop" id="gpx-drop">
      Drop GPX file here or click to browse
      <input type="file" id="gpx-file" accept=".gpx" multiple>
    </div>
    <div class="gpx-file-list" id="gpx-file-list"></div>
  </div>
</div>

<div class="stats-bar" id="stats-bar">
  <div class="stat-item">
    <span class="stat-value" id="stat-tracks">&mdash;</span>
    <span class="stat-label">Tracks</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="stat-points">&mdash;</span>
    <span class="stat-label">GPS Points</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="stat-zoom">&mdash;</span>
    <span class="stat-label">Zoom</span>
  </div>
  <a href="#" class="status-link" id="josm-link">Open in JOSM</a>
  <a href="/manager" class="status-link">Data Manager &rarr;</a>
  <span class="stat-label" id="stat-version" style="color: var(--text-dim); align-self: center;"></span>
</div>

<script src="https://unpkg.com/maplibre-gl@5.21.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<script>
(function() {
  var TILE_BASE = window.location.origin + '/tiles';

  // Parse URL hash: #z/lat/lon/style[/top10]
  var initCenter = [-98.5833, 39.8333]; // [lng, lat] for MapLibre
  var initZoom = 10;
  var initStyle = 'warm';
  var initTop10 = false;
  var hasHashView = false;
  var hash = window.location.hash.replace('#', '');
  if (hash) {
    var parts = hash.split('/');
    if (parts.length >= 3) {
      var z = parseFloat(parts[0]);
      var lat = parseFloat(parts[1]);
      var lon = parseFloat(parts[2]);
      if (!isNaN(z) && !isNaN(lat) && !isNaN(lon)) {
        initZoom = z;
        initCenter = [lon, lat];
        hasHashView = true;
      }
    }
    if (parts.length >= 4 && (parts[3] === 'warm' || parts[3] === 'cool')) {
      initStyle = parts[3];
    }
    if (parts.length >= 5 && parts[4] === 'top10') {
      initTop10 = true;
    }
  }

  var currentStyle = initStyle;
  document.getElementById('style-select').value = currentStyle;

  // Basemap tile URLs
  var basemapUrls = {
    'carto-dark': 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    'osm': 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    'carto-light': 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
  };

  // Expand {s} and {r} for MapLibre (needs explicit tile URLs)
  function expandCartoUrl(template) {
    var subdomains = ['a', 'b', 'c', 'd'];
    return subdomains.map(function(s) {
      return template.replace('{s}', s).replace('{r}', '@2x');
    });
  }

  function getBasemapTiles(key) {
    if (key === 'osm') return ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'];
    return expandCartoUrl(basemapUrls[key]);
  }

  // Build initial style spec
  var mapStyle = {
    version: 8,
    sources: {
      'basemap': {
        type: 'raster',
        tiles: getBasemapTiles('carto-dark'),
        tileSize: 256,
        maxzoom: 20,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>'
      },
      'heatmap': {
        type: 'raster',
        tiles: [TILE_BASE + '/' + currentStyle + '/{z}/{x}/{y}.png'],
        tileSize: 256,
        minzoom: 2,
        maxzoom: 18
      },
      'top10': {
        type: 'raster',
        tiles: [TILE_BASE + '/top10/{z}/{x}/{y}.png'],
        tileSize: 256,
        minzoom: 2,
        maxzoom: 18
      }
    },
    layers: [
      { id: 'basemap', type: 'raster', source: 'basemap' },
      { id: 'heatmap', type: 'raster', source: 'heatmap', paint: { 'raster-opacity': 0.85 } }
    ]
  };

  // Add top10 layer to style if restoring from URL
  if (initTop10) {
    mapStyle.layers.push({
      id: 'top10', type: 'raster', source: 'top10',
      paint: { 'raster-opacity': 0.9 }
    });
  }

  var map = new maplibregl.Map({
    container: 'map',
    style: mapStyle,
    center: initCenter,
    zoom: initZoom,
    maxZoom: 20,
    attributionControl: false
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  // Restore top10 checkbox
  var top10Toggle = document.getElementById('top10-toggle');
  if (initTop10) top10Toggle.checked = true;

  // --- Basemap switching ---
  document.getElementById('basemap-select').addEventListener('change', function(e) {
    var key = e.target.value;
    var tiles = getBasemapTiles(key);
    var attr = key === 'osm'
      ? '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      : '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>';
    map.getSource('basemap').setTiles(tiles);
    // Update attribution by removing/re-adding source (setTiles doesn't update attribution)
  });

  // --- Heatmap style switching ---
  document.getElementById('style-select').addEventListener('change', function(e) {
    currentStyle = e.target.value;
    map.getSource('heatmap').setTiles([TILE_BASE + '/' + currentStyle + '/{z}/{x}/{y}.png']);
    updateHash();
  });

  // --- Top 10% overlay toggle ---
  top10Toggle.addEventListener('change', function() {
    if (this.checked) {
      if (!map.getLayer('top10')) {
        map.addLayer({
          id: 'top10', type: 'raster', source: 'top10',
          paint: { 'raster-opacity': 0.9 }
        });
      }
    } else {
      if (map.getLayer('top10')) map.removeLayer('top10');
    }
    updateHash();
  });

  // --- Zoom display and URL hash ---
  function updateHash() {
    var c = map.getCenter();
    var z = map.getZoom();
    document.getElementById('stat-zoom').textContent = z.toFixed(1);
    var hashStr = z.toFixed(1) + '/' + c.lat.toFixed(4) + '/' + c.lng.toFixed(4) + '/' + currentStyle;
    if (top10Toggle.checked) hashStr += '/top10';
    history.replaceState(null, null, '#' + hashStr);
  }
  map.on('moveend', updateHash);
  map.on('load', updateHash);

  // --- Load stats and auto-fit ---
  fetch('/api/stats')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('stat-tracks').textContent =
        data.total_tracks.toLocaleString();
      document.getElementById('stat-points').textContent =
        (data.total_points >= 1e6)
          ? (data.total_points / 1e6).toFixed(1) + 'M'
          : data.total_points.toLocaleString();
      if (data.version) {
        document.getElementById('stat-version').textContent = 'v' + data.version;
      }
      if (data.bounds && !hasHashView) {
        map.fitBounds(
          [[data.bounds.min_lon, data.bounds.min_lat],
           [data.bounds.max_lon, data.bounds.max_lat]],
          { padding: 50 }
        );
      }
    })
    .catch(function() {});

  // --- JOSM remote control ---
  document.getElementById('josm-link').addEventListener('click', function(e) {
    e.preventDefault();
    var tmsUrl = window.location.origin + '/tiles/' + currentStyle + '/{zoom}/{x}/{y}.png';
    var josmUrl = 'http://127.0.0.1:8111/imagery?title=' + encodeURIComponent('Local Heatmap (' + currentStyle + ')')
      + '&type=tms&min_zoom=2&max_zoom=18'
      + '&url=' + encodeURIComponent(tmsUrl);
    fetch(josmUrl, { mode: 'no-cors' }).catch(function() {
      alert('Could not connect to JOSM. Make sure JOSM is running with remote control enabled.');
    });
  });

  // --- GPX overlay ---
  var gpxCounter = 0;
  var gpxLayers = {}; // filename -> { outlineId, lineId, sourceId }

  function addGpxFile(file) {
    if (gpxLayers[file.name]) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var parser = new DOMParser();
        var gpxDoc = parser.parseFromString(e.target.result, 'text/xml');
        var geojson = toGeoJSON.gpx(gpxDoc);

        gpxCounter++;
        var sourceId = 'gpx-src-' + gpxCounter;
        var outlineId = 'gpx-outline-' + gpxCounter;
        var lineId = 'gpx-line-' + gpxCounter;

        map.addSource(sourceId, { type: 'geojson', data: geojson });

        map.addLayer({
          id: outlineId, type: 'line', source: sourceId,
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#000000', 'line-width': 5, 'line-opacity': 0.5 }
        });
        map.addLayer({
          id: lineId, type: 'line', source: sourceId,
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-opacity': 0.95 }
        });

        gpxLayers[file.name] = { sourceId: sourceId, outlineId: outlineId, lineId: lineId };
        updateGpxFileList();

        // Fit to GPX bounds
        try {
          var coords = [];
          geojson.features.forEach(function(f) {
            if (f.geometry && f.geometry.coordinates) {
              var c = f.geometry.coordinates;
              if (f.geometry.type === 'LineString') {
                c.forEach(function(p) { coords.push(p); });
              } else if (f.geometry.type === 'MultiLineString') {
                c.forEach(function(line) { line.forEach(function(p) { coords.push(p); }); });
              }
            }
          });
          if (coords.length > 0) {
            var bounds = coords.reduce(function(b, c) {
              return b.extend(c);
            }, new maplibregl.LngLatBounds(coords[0], coords[0]));
            map.fitBounds(bounds, { padding: 50 });
          }
        } catch(boundsErr) {}
      } catch(err) {
        alert('Failed to parse GPX file: ' + file.name + '\n' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function removeGpxFile(name) {
    var info = gpxLayers[name];
    if (info) {
      if (map.getLayer(info.lineId)) map.removeLayer(info.lineId);
      if (map.getLayer(info.outlineId)) map.removeLayer(info.outlineId);
      if (map.getSource(info.sourceId)) map.removeSource(info.sourceId);
      delete gpxLayers[name];
      updateGpxFileList();
    }
  }

  function updateGpxFileList() {
    var list = document.getElementById('gpx-file-list');
    list.innerHTML = '';
    Object.keys(gpxLayers).forEach(function(name) {
      var item = document.createElement('div');
      item.className = 'gpx-file-item';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'gpx-name';
      nameSpan.textContent = name;
      var btn = document.createElement('button');
      btn.className = 'gpx-remove';
      btn.textContent = '\u00d7';
      btn.title = 'Remove overlay';
      btn.onclick = function() { removeGpxFile(name); };
      item.appendChild(nameSpan);
      item.appendChild(btn);
      list.appendChild(item);
    });
  }

  // File picker
  var gpxDrop = document.getElementById('gpx-drop');
  var gpxInput = document.getElementById('gpx-file');
  gpxDrop.addEventListener('click', function() { gpxInput.click(); });
  gpxInput.addEventListener('change', function() {
    Array.from(this.files).forEach(addGpxFile);
    this.value = '';
  });

  // Drag and drop on drop zone
  gpxDrop.addEventListener('dragover', function(e) {
    e.preventDefault();
    gpxDrop.classList.add('dragover');
  });
  gpxDrop.addEventListener('dragleave', function() {
    gpxDrop.classList.remove('dragover');
  });
  gpxDrop.addEventListener('drop', function(e) {
    e.preventDefault();
    gpxDrop.classList.remove('dragover');
    Array.from(e.dataTransfer.files).forEach(function(f) {
      if (f.name.toLowerCase().endsWith('.gpx')) addGpxFile(f);
    });
  });

  // Drag and drop anywhere on map
  var mapEl = document.getElementById('map');
  mapEl.addEventListener('dragover', function(e) { e.preventDefault(); });
  mapEl.addEventListener('drop', function(e) {
    e.preventDefault();
    Array.from(e.dataTransfer.files).forEach(function(f) {
      if (f.name.toLowerCase().endsWith('.gpx')) addGpxFile(f);
    });
  });
})();
</script>
</body>
</html>
