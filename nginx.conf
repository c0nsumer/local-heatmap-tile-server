worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    access_log    /dev/stdout;

    upstream uvicorn {
        server 127.0.0.1:8001;
        keepalive 8;
    }

    server {
        listen 8000;

        # Friendly error page when uvicorn isn't up yet
        error_page 502 /502.html;
        location = /502.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Tile requests: try disk first, fall back to uvicorn
        location /tiles/ {
            root /data;

            add_header Cache-Control "public, max-age=300" always;
            add_header X-Tile-Source "nginx-static" always;
            add_header Access-Control-Allow-Origin "*" always;

            try_files $uri @uvicorn;
        }

        # Named location for proxying to uvicorn
        location @uvicorn {
            proxy_pass http://uvicorn;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else goes to uvicorn
        location / {
            proxy_pass http://uvicorn;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Needed for FIT file uploads
            client_max_body_size 100m;

            # Long timeout for export/rebuild operations
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
